name: Hourly eBay check

on:
  push:
    branches:
      - master

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/check
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://koahi.vercel.app/api/check
