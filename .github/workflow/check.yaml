name: Hourly eBay check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubantu-latest
    steps:
      - name: Call /api/check
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://koahi.vercel.app/api/check
